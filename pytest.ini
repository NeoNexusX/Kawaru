[pytest]
# Terminal realtime logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s | %(levelname)8s | %(filename)s:%(lineno)d | %(message)s
log_cli_date_format = %H:%M:%S
# Pytest log file path
log_file = tests/pytest.log
log_file_level = INFO
log_file_format = %(asctime)s | %(levelname)8s | %(name)s | %(filename)s:%(lineno)d | %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# Asyncio configuration
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session

# Pytest markers (You can add your group tags for test cases here.)
markers =
    oss: marks the real OSS/FC extraction flow (preflight + STS + direct upload + simulated callback + RAW download + cleanup; runs in CI)
    perf_concurrent: marks tests as concurrent login + list_files latency benchmark
    password_reset: marks the forgot-password reset end-to-end test (needs running server + worker debug logs + SMTP)
    order: marks tests as delete
