name: Prod CD

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: prod-cd
  cancel-in-progress: false        # 正式发布不抢占：让已在跑的发布跑完，避免半途中断生产滚动

jobs:
  # ① 构建并推送正式镜像（latest + sha-<sha>，与 dev-latest / test- 区分）
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Log in to ACR
        uses: docker/login-action@v4
        with:
          registry: crpi-y6a776c9l4k3agmh.cn-hongkong.personal.cr.aliyuncs.com
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: crpi-y6a776c9l4k3agmh.cn-hongkong.personal.cr.aliyuncs.com/kawaru/kawaru
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=long

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: true
          # ACR 个人版拒绝 OCI attestation manifest，必须关闭 provenance/sbom
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ② 部署到独立 prod 服务器：同步 compose → pull → up（不碰 .env / prod-config.yaml）
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Sync compose file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: 22
          source: docker/docker-compose.prod.yml
          target: /opt/kawaru-prod/
          strip_components: 1            # 去掉 docker/ 前缀 → /opt/kawaru-prod/docker-compose.prod.yml

      - name: Pull & up
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: 22
          envs: ACR_USERNAME,ACR_PASSWORD,APP_IMAGE,DEPLOY_SHA
          script: |
            set -e
            set -o pipefail
            export APP_IMAGE="${APP_IMAGE,,}"   # 统一转小写（ACR 仓库名要求小写）
            cd /opt/kawaru-prod

            # ACR_PASSWORD 是 CI 推送用的可写凭证：只写进临时 DOCKER_CONFIG（mktemp 目录
            # 0700），不落 ~/.docker/config.json；trap 保证任意退出路径都清理——
            # 旧写法 set -e 中途失败会跳过尾部 logout，推送密码就长期留在服务器上
            export DOCKER_CONFIG="$(mktemp -d)"
            trap 'rm -rf "$DOCKER_CONFIG"' EXIT
            trap 'exit 1' HUP INT TERM   # 信号中断也转成正常退出，确保上面的 trap 执行
            # 香港服务器与 ACR 同地域，走 -vpc 内网域名拉取（dev 在杭州只能走公网域名）
            echo "$ACR_PASSWORD" | docker login crpi-y6a776c9l4k3agmh-vpc.cn-hongkong.personal.cr.aliyuncs.com -u "$ACR_USERNAME" --password-stdin
            COMPOSE="docker compose -f docker-compose.prod.yml -p kawaru-prod"
            $COMPOSE pull migrate app worker beat
            $COMPOSE up -d --wait --wait-timeout 180 mariadb redis

            mkdir -p ./data/backups
            BACKUP_PATH="./data/backups/$(date +%Y%m%d-%H%M%S)-${DEPLOY_SHA}.sql.gz"
            $COMPOSE exec -T mariadb sh -lc \
              'exec mariadb-dump -uroot -p"$MARIADB_ROOT_PASSWORD" --single-transaction --routines --triggers "$MARIADB_DATABASE"' \
              | gzip > "$BACKUP_PATH"
            test -s "$BACKUP_PATH"

            $COMPOSE up --no-deps --force-recreate \
              --abort-on-container-exit --exit-code-from migrate migrate
            $COMPOSE up -d --no-deps --wait --wait-timeout 300 app worker beat
            find ./data/backups -type f -name '*.sql.gz' -mtime +30 -delete
            # 部署成功后才执行：本地 latest 标签指向本次部署的镜像（与 ACR 的 latest 同 digest）
            docker tag "$APP_IMAGE" "${APP_IMAGE%:*}:latest"
            # 清理无容器引用且超过 7 天的旧镜像（历史 sha-<sha> / dangling）；ACR 仍保留全部 tag，可随时回拉
            docker image prune -af --filter "until=168h"
            # 凭证清理由开头的 trap 统一负责（临时 DOCKER_CONFIG 随目录删除），无需 logout
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          APP_IMAGE: crpi-y6a776c9l4k3agmh-vpc.cn-hongkong.personal.cr.aliyuncs.com/kawaru/kawaru:sha-${{ github.sha }}
          DEPLOY_SHA: ${{ github.sha }}

      # 上一步任意失败（healthcheck 超时 / 容器 crash / pull 失败）都会落到这里：
      # 把 5 个服务的状态 + 各自 tail 日志打出来，免去人工 SSH 翻日志
      - name: Dump stack diagnostics on failure
        if: failure()
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: 22
          envs: APP_IMAGE
          script: |
            set +e   # 诊断阶段不要因为某条命令失败就中断
            export APP_IMAGE="${APP_IMAGE,,}"   # 同 deploy：compose 插值需要它，否则 ps/logs 全挂
            cd /opt/kawaru-prod
            COMPOSE="docker compose -f docker-compose.prod.yml -p kawaru-prod"

            echo "========== compose ps =========="
            $COMPOSE ps -a

            echo "========== app inspect (health + state) =========="
            APP_CID=$($COMPOSE ps -q app)
            if [ -n "$APP_CID" ]; then
              docker inspect --format '{{json .State}}' "$APP_CID" \
                | python3 -c "import sys,json; print(json.dumps(json.load(sys.stdin), indent=2))" 2>/dev/null \
                || docker inspect --format '{{json .State}}' "$APP_CID"
            fi

            for svc in migrate app worker beat mariadb redis; do
              echo "========== logs: $svc (tail=200) =========="
              $COMPOSE logs --no-color --tail=200 "$svc" 2>&1 || true
            done
            exit 0   # 诊断步骤永远成功；最终任务失败由前一步决定
        env:
          APP_IMAGE: crpi-y6a776c9l4k3agmh-vpc.cn-hongkong.personal.cr.aliyuncs.com/kawaru/kawaru:sha-${{ github.sha }}
