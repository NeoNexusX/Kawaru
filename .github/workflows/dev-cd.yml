name: Dev CD

on:
  push:
    branches: [dev]

permissions:
  contents: read

env:
  # ACR 地址只在这里定义一次；deploy 阶段的登录域名由 APP_IMAGE 前缀推出，
  # 不会出现「镜像拉取域名改了、docker login 漏改」导致的 unauthorized
  ACR_REGISTRY: crpi-y6a776c9l4k3agmh.cn-hongkong.personal.cr.aliyuncs.com
  ACR_REPO: kawaru/kawaru

concurrency:
  group: dev-cd
  cancel-in-progress: false        # 数据库迁移不可被新提交中途取消

jobs:
  # ① 构建并推送 dev 镜像（dev-latest + dev-<sha>，前缀与 test- 区分）
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Log in to ACR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.ACR_REGISTRY }}/${{ env.ACR_REPO }}
          tags: |
            type=raw,value=dev-latest
            type=sha,prefix=dev-,format=long

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: true
          # ACR 个人版拒绝 OCI attestation manifest，必须关闭 provenance/sbom
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ② 部署到独立 dev 服务器：同步 compose → pull → up（不碰 .env / dev-config.yaml）
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Sync compose file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEV_SSH_HOST }}
          username: ${{ secrets.DEV_SSH_USER }}
          key: ${{ secrets.DEV_SSH_KEY }}
          port: 22
          source: docker/docker-compose.dev.yml
          target: /opt/kawaru-dev/
          strip_components: 1            # 去掉 docker/ 前缀 → /opt/kawaru-dev/docker-compose.dev.yml

      - name: Pull & up
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEV_SSH_HOST }}
          username: ${{ secrets.DEV_SSH_USER }}
          key: ${{ secrets.DEV_SSH_KEY }}
          port: 22
          envs: ACR_USERNAME,ACR_PASSWORD,APP_IMAGE,DEPLOY_SHA
          script: |
            set -e
            set -o pipefail
            cd /opt/kawaru-dev

            # ACR_PASSWORD 是 CI 推送用的可写凭证：只写进临时 DOCKER_CONFIG（mktemp 目录
            # 0700），不落 ~/.docker/config.json；trap 保证任意退出路径都清理——
            # 旧写法 set -e 中途失败会跳过尾部 logout，推送密码就长期留在服务器上
            export DOCKER_CONFIG="$(mktemp -d)"
            trap 'rm -rf "$DOCKER_CONFIG"' EXIT
            trap 'exit 1' HUP INT TERM   # 信号中断也转成正常退出，确保上面的 trap 执行
            # 登录域名直接取镜像名的 registry 前缀（APP_IMAGE 本身就是全小写），
            # 与下面 compose pull 的域名天然一致，不会再出现登录/拉取域名不一致的 unauthorized
            echo "$ACR_PASSWORD" | docker login "${APP_IMAGE%%/*}" -u "$ACR_USERNAME" --password-stdin
            COMPOSE="docker compose -f docker-compose.dev.yml -p kawaru-dev"
            $COMPOSE pull migrate app worker beat
            $COMPOSE up -d --wait --wait-timeout 180 mariadb redis

            mkdir -p ./data/backups
            BACKUP_PATH="./data/backups/$(date +%Y%m%d-%H%M%S)-${DEPLOY_SHA}.sql.gz"
            $COMPOSE exec -T mariadb sh -lc \
              'exec mariadb-dump -uroot -p"$MARIADB_ROOT_PASSWORD" --single-transaction --routines --triggers "$MARIADB_DATABASE"' \
              | gzip > "$BACKUP_PATH"
            test -s "$BACKUP_PATH"

            $COMPOSE up --no-deps --force-recreate \
              --abort-on-container-exit --exit-code-from migrate migrate
            $COMPOSE up -d --no-deps --wait --wait-timeout 300 app worker beat
            find ./data/backups -type f -name '*.sql.gz' -mtime +7 -delete
            # 部署成功后才执行：本地 dev-latest 标签指向本次部署的镜像（与 ACR 的 dev-latest 同 digest）
            docker tag "$APP_IMAGE" "${APP_IMAGE%:*}:dev-latest"
            # 清理无容器引用且超过 7 天的旧镜像（历史 dev-<sha> / dangling）；ACR 仍保留全部 tag，可随时回拉
            docker image prune -af --filter "until=168h"
            # 凭证清理由开头的 trap 统一负责（临时 DOCKER_CONFIG 随目录删除），无需 logout
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          APP_IMAGE: ${{ env.ACR_REGISTRY }}/${{ env.ACR_REPO }}:dev-${{ github.sha }}
          DEPLOY_SHA: ${{ github.sha }}

      # 上一步任意失败（healthcheck 超时 / 容器 crash / pull 失败）都会落到这里：
      # 把 5 个服务的状态 + 各自 tail 日志打出来，免去人工 SSH 翻日志
      - name: Dump stack diagnostics on failure
        if: failure()
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEV_SSH_HOST }}
          username: ${{ secrets.DEV_SSH_USER }}
          key: ${{ secrets.DEV_SSH_KEY }}
          port: 22
          envs: APP_IMAGE
          script: |
            set +e   # 诊断阶段不要因为某条命令失败就中断
            cd /opt/kawaru-dev
            COMPOSE="docker compose -f docker-compose.dev.yml -p kawaru-dev"

            echo "========== compose ps =========="
            $COMPOSE ps -a

            echo "========== app inspect (health + state) =========="
            APP_CID=$($COMPOSE ps -q app)
            if [ -n "$APP_CID" ]; then
              docker inspect --format '{{json .State}}' "$APP_CID" \
                | python3 -c "import sys,json; print(json.dumps(json.load(sys.stdin), indent=2))" 2>/dev/null \
                || docker inspect --format '{{json .State}}' "$APP_CID"
            fi

            for svc in migrate app worker beat mariadb redis; do
              echo "========== logs: $svc (tail=200) =========="
              $COMPOSE logs --no-color --tail=200 "$svc" 2>&1 || true
            done
            exit 0   # 诊断步骤永远成功；最终任务失败由前一步决定
        env:
          APP_IMAGE: ${{ env.ACR_REGISTRY }}/${{ env.ACR_REPO }}:dev-${{ github.sha }}
