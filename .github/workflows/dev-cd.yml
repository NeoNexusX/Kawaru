name: Dev CD

on:
  push:
    branches: [dev]

permissions:
  contents: read
  packages: write

concurrency:
  group: dev-cd
  cancel-in-progress: true

jobs:
  # ① 构建并推送 dev 镜像（dev-latest + dev-<sha>，前缀与 test- 区分）
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/kawaru   # metadata-action 自动转小写
          tags: |
            type=raw,value=dev-latest
            type=sha,prefix=dev-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ② 部署到独立 dev 服务器：同步 compose → pull → up（不碰 .env / dev-config.yaml）
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Sync compose file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEV_SSH_HOST }}
          username: ${{ secrets.DEV_SSH_USER }}
          key: ${{ secrets.DEV_SSH_KEY }}
          port: 22
          source: docker/docker-compose.dev.yml
          target: /opt/kawaru-dev/
          strip_components: 1            # 去掉 docker/ 前缀 → /opt/kawaru-dev/docker-compose.dev.yml

      - name: Pull & up
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEV_SSH_HOST }}
          username: ${{ secrets.DEV_SSH_USER }}
          key: ${{ secrets.DEV_SSH_KEY }}
          port: 22
          envs: GHCR_PULL_USER,GHCR_PULL_TOKEN,APP_IMAGE
          script: |
            set -e
            export APP_IMAGE="${APP_IMAGE,,}"   # GHCR 仓库名必须小写（owner 可能含大写）
            cd /opt/kawaru-dev
            echo "$GHCR_PULL_TOKEN" | docker login ghcr.io -u "$GHCR_PULL_USER" --password-stdin
            docker compose -f docker-compose.dev.yml -p kawaru-dev pull
            docker compose -f docker-compose.dev.yml -p kawaru-dev up -d --wait --wait-timeout 300
            docker logout ghcr.io
        env:
          GHCR_PULL_USER: ${{ secrets.GHCR_PULL_USER }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          APP_IMAGE: ghcr.io/${{ github.repository_owner }}/kawaru:dev-latest
