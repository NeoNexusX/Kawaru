name: Dev CD

on:
  push:
    branches: [dev]

permissions:
  contents: read
  packages: write

concurrency:
  group: dev-cd
  cancel-in-progress: false        # 数据库迁移不可被新提交中途取消

jobs:
  # ① 构建并推送 dev 镜像（dev-latest + dev-<sha>，前缀与 test- 区分）
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/kawaru   # metadata-action 自动转小写
          tags: |
            type=raw,value=dev-latest
            type=sha,prefix=dev-,format=long

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ② 部署到独立 dev 服务器：同步 compose → pull → up（不碰 .env / dev-config.yaml）
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Sync compose file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEV_SSH_HOST }}
          username: ${{ secrets.DEV_SSH_USER }}
          key: ${{ secrets.DEV_SSH_KEY }}
          port: 22
          source: docker/docker-compose.dev.yml
          target: /opt/kawaru-dev/
          strip_components: 1            # 去掉 docker/ 前缀 → /opt/kawaru-dev/docker-compose.dev.yml

      - name: Pull & up
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEV_SSH_HOST }}
          username: ${{ secrets.DEV_SSH_USER }}
          key: ${{ secrets.DEV_SSH_KEY }}
          port: 22
          envs: GHCR_PULL_USER,GHCR_PULL_TOKEN,APP_IMAGE,DEPLOY_SHA
          script: |
            set -e
            set -o pipefail
            # 杭州节点访问 ghcr.io 需走代理：先开 clash + TUN（TUN 透明代理才能覆盖 docker daemon 的拉镜像流量）
            # trap 内加 set +e：EXIT trap 执行时 set -e 仍生效，避免 off 函数内部的"无害失败"把清理中途打断、梯子留在服务器上
            trap 'set +e; clashctl off' EXIT   # 无论成功/失败退出都关掉代理
            # clashctl/clashtun 是服务器 .bashrc 里的交互函数，内部探测命令（grep/pkill 等）可能返回非零：
            # 交互终端里无害，但在 set -e 下会静默终止整个脚本 → 容忍其返回码，真实可用性由下方 curl 检查兜底
            clashctl on  || echo "WARN: clashctl on rc=$?"
            clashtun on || echo "WARN: clashtun on rc=$?"
            # 显式验证代理连通性；不带 -f：匿名访问 /v2/ 返回 401 是 registry API 正常行为，收到响应即视为连通
            curl -sS -o /dev/null --max-time 10 https://ghcr.io/v2/ \
              || { echo "ERROR: ghcr.io 不可达，代理未生效，中止部署"; exit 1; }
            export APP_IMAGE="${APP_IMAGE,,}"   # GHCR 仓库名必须小写（owner 可能含大写）
            cd /opt/kawaru-dev
            echo "$GHCR_PULL_TOKEN" | docker login ghcr.io -u "$GHCR_PULL_USER" --password-stdin
            COMPOSE="docker compose -f docker-compose.dev.yml -p kawaru-dev"
            $COMPOSE pull migrate app worker beat
            $COMPOSE up -d --wait --wait-timeout 180 mariadb redis

            mkdir -p ./data/backups
            BACKUP_PATH="./data/backups/$(date +%Y%m%d-%H%M%S)-${DEPLOY_SHA}.sql.gz"
            $COMPOSE exec -T mariadb sh -lc \
              'exec mariadb-dump -uroot -p"$MARIADB_ROOT_PASSWORD" --single-transaction --routines --triggers "$MARIADB_DATABASE"' \
              | gzip > "$BACKUP_PATH"
            test -s "$BACKUP_PATH"

            $COMPOSE up --no-deps --force-recreate \
              --abort-on-container-exit --exit-code-from migrate migrate
            $COMPOSE up -d --no-deps --wait --wait-timeout 300 app worker beat
            find ./data/backups -type f -name '*.sql.gz' -mtime +7 -delete
            # 部署成功后才执行：本地 dev-latest 标签指向本次部署的镜像（与 GHCR 的 dev-latest 同 digest）
            docker tag "$APP_IMAGE" "${APP_IMAGE%:*}:dev-latest"
            # 清理无容器引用且超过 7 天的旧镜像（历史 dev-<sha> / dangling）；GHCR 仍保留全部 tag，可随时回拉
            docker image prune -af --filter "until=168h"
            docker logout ghcr.io
        env:
          GHCR_PULL_USER: ${{ secrets.GHCR_PULL_USER }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          APP_IMAGE: ghcr.io/${{ github.repository_owner }}/kawaru:dev-${{ github.sha }}
          DEPLOY_SHA: ${{ github.sha }}

      # 上一步任意失败（healthcheck 超时 / 容器 crash / pull 失败）都会落到这里：
      # 把 5 个服务的状态 + 各自 tail 日志打出来，免去人工 SSH 翻日志
      - name: Dump stack diagnostics on failure
        if: failure()
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEV_SSH_HOST }}
          username: ${{ secrets.DEV_SSH_USER }}
          key: ${{ secrets.DEV_SSH_KEY }}
          port: 22
          envs: APP_IMAGE
          script: |
            set +e   # 诊断阶段不要因为某条命令失败就中断
            export APP_IMAGE="${APP_IMAGE,,}"   # 同 deploy：compose 插值需要它，否则 ps/logs 全挂
            cd /opt/kawaru-dev
            COMPOSE="docker compose -f docker-compose.dev.yml -p kawaru-dev"

            echo "========== compose ps =========="
            $COMPOSE ps -a

            echo "========== app inspect (health + state) =========="
            APP_CID=$($COMPOSE ps -q app)
            if [ -n "$APP_CID" ]; then
              docker inspect --format '{{json .State}}' "$APP_CID" \
                | python3 -c "import sys,json; print(json.dumps(json.load(sys.stdin), indent=2))" 2>/dev/null \
                || docker inspect --format '{{json .State}}' "$APP_CID"
            fi

            for svc in migrate app worker beat mariadb redis; do
              echo "========== logs: $svc (tail=200) =========="
              $COMPOSE logs --no-color --tail=200 "$svc" 2>&1 || true
            done
            exit 0   # 诊断步骤永远成功；最终任务失败由前一步决定
        env:
          APP_IMAGE: ghcr.io/${{ github.repository_owner }}/kawaru:dev-${{ github.sha }}
