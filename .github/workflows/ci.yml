name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches: [test]
  pull_request:
    branches: [test]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: kawaru
          MARIADB_USER: kawaru
          MARIADB_PASSWORD: kawaru-ci-db-pass
          MARIADB_ROOT_PASSWORD: kawaru-ci-db-pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uroot -pkawaru-ci-db-pass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      MAILGUN_API_KEY: ci-mailgun-key
      SMTP_PASSWORD: ci-smtp-password
      DATABASE_PASSWORD: kawaru-ci-db-pass
      REDIS_PASSWORD: ""
      SECRET_KEY: ci-secret-key
      LOG_DIR: kawaru_logs
      LOG_LEVEL: info
      CONFIG_PATH: ${{ github.workspace }}/.github/ci/config.yaml
      REGION_PATH: ${{ github.workspace }}/external/countries-states-cities-database/json/countries.json

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.7.22"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Create CI config
        run: |
          mkdir -p .github/ci
          cat > .github/ci/config.yaml <<'EOF'
          server:
            name: Kawaru
            port: 8000
            host: 127.0.0.1

          token:
            token_expire_minutes: 1440
            login_expire_minutes: 120
            algorithm: HS256

          email:
            mailgun_domain: ci.example.com
            smtp_port: 465
            smtp_username: ci@example.com
            smtp_from_email: ci@example.com
            smtp_server: smtp.example.com
            totp_window: 30

          database:
            host: 127.0.0.1
            db_name: kawaru
            db_type: mariadb
            db_username: kawaru
            pool_size: 10
            max_overflow: 20
            echo_pool: false
            pool_recycle: 3600
            port: 3306

          redis:
            username: default
            host: 127.0.0.1
            port: 6379
            max_connection: 50
            default_db_index: 0
            celery_broker_db_index: 1
            celery_backend_db_index: 2
            celery_redbeat_db_index: 3

          celery:
            enable_embedded_celery: false
            worker_concurrency: 2
            worker_log_level: "INFO"
            worker_log_file: "kawaru_logs/celery.log"
            worker_disable_rate_limits: true
            worker_pool: "prefork"

          storage:
            root: ./.ci-storage
            local_root: data/
            max_file_size_gb: 2000000000
            chunk_buffer_size_mb: 1
            max_chunks_per_upload: 40
            allowed_storage_types: ["local"]
            allowed_file_types: ["zip"]
            allowed_experiment_types: ["imzML"]
            max_path_length: 255
            max_filename_length: 100
            max_file_type_length: 64
            max_files_per_user: 20
            max_downloads_per_user: 50
            preflight_ttl_minutes: 30
            chunk_ttl_minutes: 30
            cleanup_preflights_interval_minutes: 60
            cleanup_download_zip_interval_minutes: 1440
            download_zip_retention_days: 7

          oss:
            region_id: cn-shenzhen
            bucket_name: kawaru-storage
            oss_upload_sts_token_expire_minutes: 15
            oss_download_sts_token_expire_minutes: 60
            oss_zip_storage_root: data/
            oss_experiment_storage_root: experiments/

          admin_info:
            username: kawaru
            institution: Xiamen University
            position: Researcher
            research_field: Massflow
            region: China
            orcid: admin
            homepage: admin
            email: admin@example.com

          user:
            allowed_position_types:
              - Researcher
              - Postdoctoral Researcher
              - Research Assistant
              - Research Engineer
              - Senior Researcher
              - Professor
              - Associate Professor
              - Lecture
              - PhD Student
              - Master's Student
            max_identity_length: 10
            max_username_length: 128
            max_useremail_length: 128
            max_institution_length: 128
            max_position_length: 128
            max_research_field_length: 128
            max_region_length: 128
            max_orcid_length: 128
            max_homepage_length: 128

          sample_info:
            max_experiment_name_length: 128
            max_experiment_type_length: 128
            max_organism_length: 128
            max_organism_part_length: 128
            max_condition_length: 128
            max_sample_growth_conditions_length: 128
            max_sample_stabilization_length: 128
            max_tissue_modification_length: 128
            max_maldi_matrix_length: 128
            max_maldi_matrix_application_length: 128
            max_solvent_length: 128
          EOF

      - name: Install dependencies
        run: uv sync --frozen

      - name: Sanity check imports
        run: uv run python -m compileall main.py api background boot celery_runtime constants database models routers storage_backend tests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: kawaru:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
