# 测试栈：临时、跑完即销，整套走 9001（与正式 8000 隔离）。
# Celery worker / beat 已拆分为独立容器（与生产部署一致）。
# 本地手动跑：
#   docker compose -f docker/docker-compose.test.yml -p kawaru-test up -d --build
#   docker compose -f docker/docker-compose.test.yml -p kawaru-test exec -u root app sh -lc 'mkdir -p /test_temp && chown -R appuser /test_temp'
#   docker compose -f docker/docker-compose.test.yml -p kawaru-test exec -T app python -m pytest -m "oss or perf_concurrent" -q
#   docker compose -f docker/docker-compose.test.yml -p kawaru-test down -v
name: kawaru-test

# ---------- 共享环境变量（YAML anchor，避免三份重复） ----------
# 注意：env 定义为 list-of-strings 形式，方便 YAML alias 整体复用；
# 如果某个 service 需要追加变量，用 compose 的 env_file 或单独 environment 覆盖。
x-common-env: &common-env
  - CONFIG_PATH=/app/docker/test-config.yaml
  - REGION_PATH=/app/external/countries-states-cities-database/json/countries.json
  - LOG_DIR=kawaru_logs
  - LOG_LEVEL=debug
  - SECRET_KEY=test-secret-key
  - DATABASE_PASSWORD=kawaru-test-pass      # 与 mariadb 一致（测试内部值，非 secret）
  - REDIS_PASSWORD=                         # redis 无密码
  - SMTP_PASSWORD=${SMTP_PASSWORD:-}
  # OSS（必需；CI 的 integration-test 步骤会校验，缺则直接失败）
  - OSS_ACCESS_KEY_ID=${OSS_ACCESS_KEY_ID:-}
  - OSS_ACCESS_KEY_SECRET=${OSS_ACCESS_KEY_SECRET:-}
  - OSS_ROLE_ARN=${OSS_ROLE_ARN:-}
  # FC 函数 token（app 启动时 import background.processing_background 会读取，缺则为 None；测试不触发 FC，可留空）
  - OSS_FC_ALGORITHM_TOKEN=${OSS_FC_ALGORITHM_TOKEN:-}
  - OSS_FC_TIC_TOKEN=${OSS_FC_TIC_TOKEN:-}
  - OSS_FC_FEATURE_TOKEN=${OSS_FC_FEATURE_TOKEN:-}
  - OSS_FC_PACKUP_TOKEN=${OSS_FC_PACKUP_TOKEN:-}
  # FC 回调校验 token：api/callback_api.py 在 import 时硬读 os.environ["FC_CALLBACK_TOKEN"]，缺则 KeyError 直接崩；测试不触发回调，给占位即可
  - FC_CALLBACK_TOKEN=${FC_CALLBACK_TOKEN:-test-fc-callback-token}
  - BASE_URL=http://127.0.0.1:9001          # pytest 客户端连本容器 9001

services:
  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: kawaru
      MARIADB_USER: kawaru
      MARIADB_PASSWORD: kawaru-test-pass
      MARIADB_ROOT_PASSWORD: kawaru-test-pass
    tmpfs:
      - /var/lib/mysql      # 数据放内存，down 即销
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "127.0.0.1", "-uroot", "-pkawaru-test-pass"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    image: ${KAWARU_IMAGE:-kawaru-test:local}   # CI 注入 GHCR 预构建镜像；本地不设则用默认名配合 build
    build:                                       # 仅本地开发用（CI 在 GitHub 构建后推 GHCR，测试时只 pull --no-build）
      context: ..
      dockerfile: docker/Dockerfile
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment: *common-env
    ports:
      - "9001:9001"
    volumes:
      - kawaru-logs:/app/kawaru_logs   # 与 celery-worker 共享日志目录：tests/helpers/totp.py 在 app 容器内读 background.log 抓验证码，但 worker 把日志写在自己容器里，必须挂同一卷才能跨容器读到
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9001/docs"]
      interval: 10s
      timeout: 5s
      retries: 30

  # ---- Celery Worker（拆分独立容器） ----
  celery-worker:
    image: ${KAWARU_IMAGE:-kawaru-test:local}
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_healthy           # 等 app 先启动完成（建表 + 创建 admin）
    environment: *common-env
    volumes:
      - kawaru-logs:/app/kawaru_logs       # 与 app 共享日志（tests/helpers/totp.py 需读 worker 写的 background.log）
    command:
      - "python"
      - "-m"
      - "celery"
      - "-A"
      - "celery_runtime.entrypoint:celery_app"
      - "worker"
      - "--pool"
      - "threads"
      - "--loglevel"
      - "INFO"
      - "--logfile"
      - "kawaru_logs/celery-worker.log"
      - "-Q"
      - "default"
      - "--without-gossip"
      - "--concurrency"
      - "10"
    # 不加 healthcheck：
    # 1) `celery inspect ping` 每次都冷启动 python + 重新加载 task 列表，10s 超时内回不来；
    # 2) compose --wait 对无 healthcheck 的 service 只要求 Started，不要求 Healthy；
    # 3) worker 异步消费 broker，pytest 时即便还没完全 ready，消息会缓冲在 Redis 里。

  # ---- Celery Beat（拆分独立容器） ----
  celery-beat:
    image: ${KAWARU_IMAGE:-kawaru-test:local}
    depends_on:
      redis:
        condition: service_healthy
      app:
        condition: service_healthy
    environment: *common-env
    volumes:
      - kawaru-logs:/app/kawaru_logs       # 共享日志目录，便于排查（beat 不写验证码，但日志统一处更好）
    command:
      - "python"
      - "-m"
      - "celery"
      - "-A"
      - "celery_runtime.beat_entrypoint:beat_app"
      - "beat"
      - "--loglevel"
      - "info"
      - "--logfile"
      - "kawaru_logs/celery-beat.log"
    # 不加 healthcheck：beat 容器只跑 scheduler，没有 worker 进程，inspect ping 永远拿不到响应。

volumes:
  kawaru-logs:    # 跨容器共享日志（app 在容器内读 worker 写的 background.log 抓邮箱验证码）；down -v 会清空
