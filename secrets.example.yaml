# ============================================================
# GitHub Actions Secrets / CI 与 CD 配置清单
# 填法: 仓库 Settings → Secrets and variables → Actions
# push 到共享 test 分支或手动 workflow_dispatch 会触发完整 CI（见 docs 贡献指南）
# ============================================================


# ---- GitHub Secrets（必填，integration-test 会校验，缺一 fail）----

OSS_ACCESS_KEY_ID: "LTAI5t7dy..."      # 阿里云 RAM 子账号 AccessKey ID
OSS_ACCESS_KEY_SECRET: "JwN7MpDvN..."  # 阿里云 RAM 子账号 AccessKey Secret
OSS_ROLE_ARN: "acs:ram::1395274263284267:role/kawaru-oss-sts-access"  # STS 角色 ARN
SMTP_PASSWORD: "xxxxxx"                # SMTP 授权码（perf_concurrent 注册 / password_reset 走真实邮件链路，缺则发送失败）


# ---- 自动注入，无需手动配 ----
# GITHUB_TOKEN: Actions 内置，build-image / 拉 GHCR 镜像时自动用


# ---- GitHub Secrets（dev/prod CD 使用）----

DEV_SSH_HOST: "dev.example.com"
DEV_SSH_USER: "deploy"
DEV_SSH_KEY: |-
  -----BEGIN OPENSSH PRIVATE KEY-----
  ...
  -----END OPENSSH PRIVATE KEY-----

PROD_SSH_HOST: "prod.example.com"
PROD_SSH_USER: "deploy"
PROD_SSH_KEY: |-
  -----BEGIN OPENSSH PRIVATE KEY-----
  ...
  -----END OPENSSH PRIVATE KEY-----

ACR_USERNAME: "NeoNexus"             # ACR 登录用户名（CI 推送镜像 + 服务器拉取共用）
ACR_PASSWORD: "xxxxxx"               # ACR "访问凭证" 页设置的固定密码


# ---- 不在 Secrets 里，改仓库文件 ----

# docker/test-config.yaml  (oss.region_id / oss.bucket_name)
oss:
  region_id: cn-hangzhou          # 测试 bucket 的 region
  bucket_name: kawaru-oss         # 测试 bucket 名

# ---- compose 内置测试值（不是 secret，不用填 Secrets）----
# SECRET_KEY / DATABASE_PASSWORD / REDIS_PASSWORD
# 硬编码在 docker/docker-compose.test.yml，只在测试栈内用
