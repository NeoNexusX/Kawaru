# ---- GitHub Secrets（必填，integration-test 会校验，缺一 fail）----

OSS_ACCESS_KEY_ID: "LTAI5t7dy..."      # 阿里云 RAM 子账号 AccessKey ID
OSS_ACCESS_KEY_SECRET: "JwN7MpDvN..."  # 阿里云 RAM 子账号 AccessKey Secret
OSS_ROLE_ARN: "acs:ram::1395274263284267:role/kawaru-oss-sts-access"  # STS 角色 ARN


# ---- GitHub Secrets（可选，当前测试 marker 用不到，留空）----

OSS_FC_ALGORITHM_TOKEN: ""   # fc-algorithm  HTTP 触发器 token
OSS_FC_TIC_TOKEN: ""         # fc-tic        HTTP 触发器 token
OSS_FC_FEATURE_TOKEN: ""     # fc-feature    HTTP 触发器 token
OSS_FC_PACKUP_TOKEN: ""      # fc-packup     HTTP 触发器 token


# ---- 自动注入，无需手动配 ----
# GITHUB_TOKEN: Actions 内置，build-image / 拉 GHCR 镜像时自动用


# ---- 不在 Secrets 里，改仓库文件 ----

# docker/test-config.yaml  (oss.region_id / oss.bucket_name)
oss:
  region_id: cn-hangzhou          # 改成测试 bucket 的 region
  bucket_name: kawaru-oss-test    # 改成真实测试 bucket（占位不能用）

# ---- compose 内置测试值（不是 secret，不用填 Secrets）----
# SECRET_KEY / DATABASE_PASSWORD / SMTP_PASSWORD / REDIS_PASSWORD
# 硬编码在 docker/docker-compose.test.yml，只在测试栈内用
