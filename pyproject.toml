[project]
name = "kawaru"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiofiles==24.1.0",
    "alibabacloud-credentials==1.0.1",
    "alibabacloud-oss-v2>=1.2.4",
    "alibabacloud-sts20150401>=1.1.5",
    "asyncmy>=0.2.10",
    "bcrypt==3.2.0",
    "celery[gevent]>=5.6.2",
    "celery-redbeat>=2.3.3",
    "colorama>=0.4.6",
    "fastapi>=0.121.3",
    "greenlet==3.3.1",
    "httpx[http2]>=0.28.1",
    "passlib>=1.7.4",
    "pydantic>=2.12.4",
    "pyjwt>=2.10.1",
    "python-dotenv>=1.2.1",
    "python-multipart>=0.0.20",
    "pyyaml>=6.0.3",
    "redis[hiredis]>=7.1.0",
    "sqlmodel>=0.0.27",
    "starlette>=0.50.0",
    "uvicorn>=0.38.0",
    "watchfiles>=1.1.1",
    "alembic>=1.19.1",
]

[dependency-groups]
dev = [
    "black>=25.12.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-order>=1.3.0",
]

[tool.ruff.lint.per-file-ignores]
# main.py 在所有 import 之前刻意调用 bootstrap()，因此模块级 import 不在文件顶部
"main.py" = ["E402"]
