# 本地开发配置示例；复制为 config.yaml 后按实际环境修改。
# 业务密钥（DB/Redis/SMTP/OSS 凭证）不在这里，放 .env。
# 若用于 dev/prod Compose，请把数据库改为 mariadb:3306、Redis 改为 redis:6379，
# 并将 CONFIG_PATH 指向容器内挂载的配置文件。
server:
  name: SpatialXomics
  port: 8000
  host: 0.0.0.0
  # 对外 API 公网前缀，用于拼接中转下载 URL；留空则回退 request.base_url 推导
  public_base_url: ""

cors:
  allow_origins: ["*"]            # dev：按需收紧到前端域名
  allow_credentials: false
  allow_methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
  allow_headers: ["Authorization", "Content-Type", "Accept", "Origin"]
  expose_headers: ["Content-Disposition", "Content-Length"]

token:
  token_expire_minutes: 360
  login_expire_minutes: 120
  algorithm: HS256

email:
  smtp_port: 465
  smtp_username: 1513401658@qq.com
  smtp_from_email: 1513401658@qq.com
  smtp_server: smtp.qq.com
  reset_password_max_attempts: 5   # 单个邮箱验证码（注册/改邮箱/重置密码）最大校验失败次数，超过则作废该验证码
  email_send_cooldown_seconds: 60   # 同一邮箱两次发送验证码邮件的最小间隔（秒），不区分用途，防邮件轰炸

database:
  host: 127.0.0.1
  db_name: kawaru
  db_type: mariadb
  db_username: root        # 用 root 连接；密码复用 .env 的 DATABASE_PASSWORD(=MARIADB_ROOT_PASSWORD)
  pool_size: 20
  max_overflow: 20
  echo_pool: false
  pool_recycle: 3600
  port: 13306

redis:
  username: default
  host: 127.0.0.1
  port: 16379
  max_connection: 50
  default_db_index: 0
  celery_broker_db_index: 1
  celery_backend_db_index: 2
  celery_redbeat_db_index: 3

celery:
  enable_embedded_celery: false   # ★分离模式：worker/beat 由独立容器运行，app 不再 fork 子进程
  worker_concurrency: 10           # 仅参考；实际并发由 compose 的 worker --concurrency 决定
  worker_log_level: "INFO"
  worker_log_file: "kawaru_logs/celery.log"
  worker_disable_rate_limits: true
  worker_pool: "threads"

storage:
  allowed_storage_types: ["oss"]
  allowed_file_types: ["zip"]
  allowed_experiment_types: ["imzML"]
  max_path_length: 255
  max_filename_length: 100
  max_file_type_length: 64
  cleanup_preflights_interval_minutes: 60
  cleanup_download_zip_interval_minutes: 60
  cleanup_failed_experiments_interval_minutes: 60
  preflight_ttl_minutes: 600      # 预检记录 TTL 下限（分钟）；与下方带宽公式计算值取较大者
  max_file_size_gb: 20            # 允许的最大单文件（GB）；预检校验 + TTL 公式输入，不配置则不启用
  min_upload_bandwidth_mbps: 10   # 最低上传带宽假设（Mbps），TTL 公式输入，不配置则不启用公式
  upload_ttl_safety_factor: 1.5   # TTL 安全余量系数（乘式）
  download_zip_ttl_minutes: 30
  signed_url_ttl_minutes: 60
  failed_experiment_ttl_minutes: 30
  stale_process_run_timeout_minutes: 60
  stale_clustering_run_timeout_minutes: 120
  cleanup_stale_process_runs_interval_minutes: 30

oss:
  # dev：按你的真实 dev OSS/FC 资源填写（access key 等凭证放 .env）
  region_id: cn-hangzhou
  bucket_name: kawaru-oss
  # 上传 STS Token 有效期（分钟）：大文件慢速上传时需加大；上限 480 = 8 小时，
  # 且必须 <= 阿里云 RAM 角色「最大会话时长」（控制台：RAM 访问管理 → 角色 → 编辑最大会话时长）
  oss_upload_sts_token_expire_minutes: 480
  # 下载（zarr 只读）STS Token 有效期（分钟），上限同上
  oss_download_sts_token_expire_minutes: 60
  oss_zip_storage_root: data/
  oss_packup_zip_storage_root: packup/
  oss_origin_storage_root: origin/
  oss_processed_storage_root: processed/
  oss_default_timeout_seconds: 20
  oss_delete_object_timeout_seconds: 30
  oss_delete_prefix_timeout_seconds: 300
  fc_packup_endpoint: https://packup-oss-pxepaiqpge.cn-hangzhou-vpc.fcapp.run
  fc_packup_timeout_seconds: 200
  fc_algorithm_endpoint: https://algoritocessing-olclrzvpxk.cn-hangzhou-vpc.fcapp.run
  fc_algorithm_timeout_seconds: 60
  fc_tic_endpoint: https://tic-processing-mbftqczbun.cn-hangzhou-vpc.fcapp.run
  fc_tic_timeout_seconds: 60
  fc_feature_endpoint: https://umap-kmocessing-ptncayuqzz.cn-hangzhou-vpc.fcapp.run
  fc_feature_timeout_seconds: 60
  fc_raw_convert_endpoint: https://imz-to-zarr-xrujfuejtn.cn-hangzhou-vpc.fcapp.run
  fc_raw_convert_timeout_seconds: 60
  fc_clustering_endpoint: https://clusterp-kmeans-zsvrfnnprr.cn-hangzhou-vpc.fcapp.run
  fc_clustering_timeout_seconds: 60
  # 中转下载专用内网 endpoint（服务器与 OSS 同地域时可达，OSS→服务器这跳免费）。
  # 本地开发机上内网域名不可达：改用 CONFIG_PATH 指向覆盖配置，把它临时设为公网
  # endpoint（https://oss-cn-hangzhou.aliyuncs.com）即可完整验证中转链路。
  oss_internal_endpoint: https://oss-cn-hangzhou-internal.aliyuncs.com
  relay_max_concurrency: 5          # 中转下载最大并发数（保护服务器带宽）
  relay_acquire_timeout_seconds: 10 # 排队等待上限，超时返回 429
  relay_idle_timeout_seconds: 30    # 空闲超时：客户端 30s 不消费数据则中断

