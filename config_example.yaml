server:
  name: Kawaru
  port: 8000
  host: 0.0.0.0

cors:
  allow_origins: ["https://your-frontend.com"]
  allow_credentials: false
  allow_methods:
   - "GET"
   - "POST"
   - "DELETE"
   - "OPTIONS"
  allow_headers:
   - "Authorization"
   - "Content-Type"
   - "Accept"
   - "Origin"
  expose_headers:
    - "Content-Disposition"
    - "Content-Length"

token:
  token_expire_minutes: 360
  login_expire_minutes: 120
  algorithm: HS256

email:
  # Support for SMTP
  smtp_port: 465 # or 587
  smtp_username: 1513401658@qq.com
  smtp_from_email: 1513401658@qq.com
  smtp_server: smtp.qq.com
  #support for totp
  totp_window: 30

database:
  host: kawaru-test.cpes2okukxkj.ap-southeast-1.rds.amazonaws.com
  db_name: kawaru_test_new_year
  db_type: mariadb
  db_username: kawaru
  pool_size: 1000
  max_overflow: 20
  echo_pool: false
  pool_recycle: 3600
  port: 3306

redis:
  username: default
  host: 10.26.58.61
  port: 6379
  max_connection: 50
  default_db_index: 0
  celery_broker_db_index: 1
  celery_backend_db_index: 2
  celery_redbeat_db_index: 3

celery:
  enable_embedded_celery: true
  worker_concurrency: 4
  worker_log_level: "INFO"
  worker_log_file: "kawaru_logs/celery.log"
  worker_disable_rate_limits: True
  worker_pool: "prefork"
  large_file_poll_time: 1000

storage:
  root: storage
  local_root: local
  chunk_buffer_size_mb: 1
  max_chunks_per_upload: 40
  allowed_storage_types: ["local","oss"]
  allowed_file_types: ["zip"]
  allowed_experiment_types: ["imzML"]
  max_path_length: 255
  max_filename_length: 100
  max_file_type_length: 64
  cleanup_preflights_interval_minutes: 60
  cleanup_download_zip_interval_minutes: 60
  cleanup_failed_experiments_interval_minutes: 60
  preflight_ttl_minutes: 30
  download_zip_ttl_minutes: 30
  signed_url_ttl_minutes: 60
  failed_experiment_ttl_minutes: 30

oss:
  region_id: cn-hangzhou
  bucket_name: kawaru-oss
  oss_upload_sts_token_expire_minutes: 15
  oss_download_sts_token_expire_minutes: 60
  oss_zip_storage_root: data/
  oss_packup_zip_storage_root: packup/
  oss_origin_storage_root: origin/
  oss_processed_storage_root: processed/
  oss_default_timeout_seconds: 20
  fc_logstore_name: default-logs
  fc_log_project_name: serverless-cn-hangzhou-aa660bbc-2121-50eb-8de1-2d1d263fecc2
  fc_unzip_timeout_seconds: 40
  fc_packup_endpoint: https://packup-oss-pxepaiqpge.cn-hangzhou.fcapp.run
  fc_packup_timeout_seconds: 200
  fc_algorithm_endpoint: https://algoritocessing-olclrzvpxk.cn-hangzhou-vpc.fcapp.run
  fc_algorithm_timeout_seconds: 60
  fc_tic_endpoint: https://tic-processing-mbftqczbun.cn-hangzhou.fcapp.run
  fc_tic_timeout_seconds: 60
  fc_feature_endpoint: https://umap-kmocessing-ptncayuqzz.cn-hangzhou.fcapp.run
  fc_feature_timeout_seconds: 60

