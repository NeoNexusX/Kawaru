# 本地开发配置示例；复制为 config.yaml 后按实际环境修改。
# 业务密钥（DB/Redis/SMTP/OSS 凭证）不在这里，放 .env。
# 若用于 dev/prod Compose，请把数据库改为 mariadb:3306、Redis 改为 redis:6379，
# 并将 CONFIG_PATH 指向容器内挂载的配置文件。
server:
  name: SpatialXomics
  port: 8000
  host: 0.0.0.0
  # 对外 API 公网前缀，用于拼接中转下载 URL；留空则回退 request.base_url 推导
  public_base_url: ""

cors:
  allow_origins: ["*"]            # dev：按需收紧到前端域名
  allow_credentials: false
  allow_methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
  allow_headers: ["Authorization", "Content-Type", "Accept", "Origin"]
  expose_headers: ["Content-Disposition", "Content-Length"]

token:
  token_expire_minutes: 360
  login_expire_minutes: 120
  algorithm: HS256

email:
  smtp_port: 465
  smtp_username: 1513401658@qq.com
  smtp_from_email: 1513401658@qq.com
  smtp_server: smtp.qq.com
  reset_password_max_attempts: 5   # 单个邮箱验证码（注册/改邮箱/重置密码）最大校验失败次数，超过则作废该验证码
  email_send_cooldown_seconds: 60   # 同一邮箱两次发送验证码邮件的最小间隔（秒），不区分用途，防邮件轰炸
  alert_max_per_window: 100   # 管理员告警邮件在额度窗口内最多发送封数，超出丢弃（告警与验证码共用 SMTP 账号，防告警洪峰挤掉验证码）
  alert_budget_window_seconds: 3600   # 管理员告警邮件的额度窗口（秒）

database:
  host: 127.0.0.1
  db_name: kawaru
  db_type: mariadb
  db_username: root        # 用 root 连接；密码复用 .env 的 DATABASE_PASSWORD(=MARIADB_ROOT_PASSWORD)
  pool_size: 20
  max_overflow: 20
  echo_pool: false
  pool_recycle: 3600
  port: 13306

redis:
  username: default
  host: 127.0.0.1
  port: 16379
  max_connection: 50
  default_db_index: 0
  celery_broker_db_index: 1
  celery_backend_db_index: 2
  celery_redbeat_db_index: 3

celery:
  enable_embedded_celery: false   # ★分离模式：worker/beat 由独立容器运行，app 不再 fork 子进程
  worker_concurrency: 10           # 仅参考；实际并发由 compose 的 worker --concurrency 决定
  worker_log_level: "INFO"
  worker_log_file: "kawaru_logs/celery.log"
  worker_disable_rate_limits: true
  worker_pool: "threads"

storage:
  allowed_storage_types: ["oss"]
  allowed_file_types: ["zip"]
  allowed_experiment_types: ["imzML"]
  max_path_length: 255
  max_filename_length: 100
  max_file_type_length: 64
  cleanup_preflights_interval_minutes: 60
  cleanup_download_zip_interval_minutes: 60
  cleanup_failed_experiments_interval_minutes: 60
  preflight_ttl_minutes: 600      # 预检记录 TTL 下限（分钟）；与下方带宽公式计算值取较大者
  max_file_size_gb: 20            # 允许的最大单文件（GB）；预检校验 + TTL 公式输入，不配置则不启用
  min_upload_bandwidth_mbps: 10   # 最低上传带宽假设（Mbps），TTL 公式输入，不配置则不启用公式
  upload_ttl_safety_factor: 1.5   # TTL 安全余量系数（乘式）
  download_zip_ttl_minutes: 30
  signed_url_ttl_minutes: 60
  failed_experiment_ttl_minutes: 30
  stale_process_run_timeout_minutes: 60
  stale_clustering_run_timeout_minutes: 120
  cleanup_stale_process_runs_interval_minutes: 30
  # 删除兜底（DELETING / DELETE_FAILED 行的自动重投）：
  stale_deletion_timeout_minutes: 30         # 删除行停留超过该时长（分钟）才算「卡住」，才允许重投（避免和正在跑的 worker 抢）
  retry_file_deletions_interval_minutes: 15  # 文件删除重投任务 retry_stale_file_deletions 的扫描间隔（分钟）
  retry_run_deletions_interval_minutes: 15   # run 删除重投任务 retry_stale_run_deletions 的扫描间隔（分钟）

oss:
  # dev：按你的真实 dev OSS/FC 资源填写（access key 等凭证放 .env）
  region_id: cn-hangzhou
  bucket_name: kawaru-oss
  # 上传 STS Token 有效期（分钟）：大文件慢速上传时需加大；上限 480 = 8 小时，
  # 且必须 <= 阿里云 RAM 角色「最大会话时长」（控制台：RAM 访问管理 → 角色 → 编辑最大会话时长）
  oss_upload_sts_token_expire_minutes: 480
  # 下载（zarr 只读）STS Token 有效期（分钟），上限同上
  oss_download_sts_token_expire_minutes: 60
  oss_zip_storage_root: data/
  oss_origin_storage_root: origin/
  oss_processed_storage_root: processed/
  # SI 注释库 CSV 的完整 OSS key（人工上传后填写；未配置时浏览可用、下载端点报未就绪）
  oss_si_db_key: static/hmdb_4.csv
  oss_default_timeout_seconds: 20
  oss_delete_object_timeout_seconds: 30
  oss_delete_prefix_timeout_seconds: 300
  # 中转下载专用内网 endpoint（服务器与 OSS 同地域时可达，OSS→服务器这跳免费）。
  # 本地开发机上内网域名不可达：改用 CONFIG_PATH 指向覆盖配置，把它临时设为公网
  # endpoint（https://oss-cn-hangzhou.aliyuncs.com）即可完整验证中转链路。
  oss_internal_endpoint: https://oss-cn-hangzhou-internal.aliyuncs.com
  relay_max_concurrency: 10         # 中转下载最大并发数（保护服务器带宽）
  relay_acquire_timeout_seconds: 10 # 排队等待上限，超时返回 429
  relay_idle_timeout_seconds: 30    # 空闲超时：客户端 30s 不消费数据则中断
  # 浏览器直连下载（download_raw 预签名 URL）的 CDN 域名，仅正式服配置；
  # V1 签名不含 Host，只换域名不影响签名。测试服不配置则保持 OSS 域名。
  # oss_cdn_domain: https://cdn.neonexus.top

# E-HPC INSTANT（算法预处理）。四个计算任务（raw_convert/preview/algorithm/
# clustering）全部走 E-HPC，无运行时开关；未注册 EHPC 提交器的新增任务才走 FC。
# 环境变量可临时覆盖 config，无需改本文件：EHPC_CALLBACK_ENABLED。
# 凭证放 .env，不写在这里：
#   OSS_ACCESS_KEY_ID / OSS_ACCESS_KEY_SECRET  提交作业、AssumeRole 用的 RAM AK
#   ACR_PULL_USERNAME / ACR_PULL_PASSWORD      private_registry=true 时拉镜像用
#   FC_CALLBACK_TOKEN                          callback_enabled=true 时下发给容器的回调鉴权 token
ehpc:
  region: cn-hangzhou               # 作业地域：INSTANT 服务、交换机/安全组、OSS 内网 endpoint 必须同地域
  # 容器镜像。建议固定 digest（:tag 会漂移）；跨地域拉取（如香港 ACR → 杭州作业）必须用公网地址，不能带 -vpc
  image: "crpi-<instance-id>.cn-hongkong.personal.cr.aliyuncs.com/kawaru/sxo@sha256:<digest>"
  private_registry: true            # 镜像仓库需要认证；true 时读取 .env 的 ACR_PULL_USERNAME/PASSWORD
  vswitch_id: vsw-<replace>         # 作业弹性网卡挂载的交换机（VPC 子网）；决定作业落在哪个可用区、能用到哪些规格的库存，需与 region 同地域
  security_group_id: sg-<replace>   # 作业网卡的安全组，需与交换机同 VPC；回调用公网出口，出方向需放行后端回调端口
  enable_external_ip: true          # 作业是否分配公网 IP：跨地域拉镜像、回调公网后端都依赖它
  callback_enabled: true            # 是否向容器下发回调环境变量；本地调试（后端无法被公网访问）设 false 或用 EHPC_CALLBACK_ENABLED=false 覆盖
  callback_base_url: ""             # 回调地址前缀；留空用 server.public_base_url，按任务的 callback_path 拼完整 URL
  sts_duration_seconds: 10800       # 下发给容器的 STS 临时凭证有效期（秒），需 ≤ RAM 角色最大会话时长，上限 43200
  # 所有任务共用的资源档位（统一算力）：按输入大小选档，input_bytes 缺失时用最后一档
  resources:
    fallback_any_type: true     # 售罄（SoldOut）时去掉 InstanceTypes 自动重提一次，按档位 cores/memory 自选
    # 按输入大小（算法=imzml+ibd 字节数，聚类=源 zarr 的 output_size）升序选档
    tiers:
      - max_input_gib: 2        # ≤2G
        cores: 2
        memory_gib: 2
        system_disk_gib: 10
        instance_types: [ecs.c9a.large, ecs.c9ae.large, ecs.g9a.large]
      - max_input_gib: 8        # 2–8G
        cores: 4
        memory_gib: 4
        system_disk_gib: 30
        instance_types: [ecs.c9a.xlarge, ecs.c9ae.xlarge, ecs.g9a.xlarge]
      - max_input_gib: 20       # 8–20G
        cores: 4
        memory_gib: 8
        system_disk_gib: 50
        instance_types: [ecs.c9a.xlarge, ecs.c9ae.xlarge, ecs.g9ae.xlarge]
  tasks:
    raw_convert:
      command: ["python", "/app/imz_to_zarr.py"]
      results_prefix: hpc-imz-to-zarr
      callback_env: RAW_CONVERT_FC_CALLBACK_URL
      callback_path: /callback/algorithm_callback
    preview:
      command: ["python", "/app/imzml_preview.py"]
      results_prefix: hpc-preview
      callbacks:
        feature:                    # UMAP/TIC/离子图
          env: FEATURE_FC_CALLBACK_URL
          path: /callback/umap_callback
        tic:                        # 仅 TIC
          env: TIC_FC_CALLBACK_URL
          path: /callback/tic_callback
    algorithm:
      command: ["python", "/app/algorithm_processing.py"]
      results_prefix: hpc-algorithm
      callback_env: ALGORITHM_FC_CALLBACK_URL
      callback_path: /callback/algorithm_callback
    clustering:
      command: ["python", "/app/clustering_umap_kmeans.py"]
      results_prefix: hpc-clustering
      callback_env: CLUSTERING_FC_CALLBACK_URL
      callback_path: /callback/clustering_callback
